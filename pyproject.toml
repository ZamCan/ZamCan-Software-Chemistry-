[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zamcan-software-chemistry"
version = "0.1.0"
description = "ZamCan Software Chemistry — Software Chemistry Model (SCM), Language Chemistry Model (LCM), and ZCM scientific applications."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["scm*", "lcm*", "zcm*", "knowledge*"]
