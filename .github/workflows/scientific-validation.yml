name: Scientific validation

on:
  push:
    branches: ["main", "engineering/**", "scm/**", "lcm/**", "zcm/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install .

      - name: Verify installed scientific layers
        run: |
          python -c "import scm, lcm, zcm, knowledge; from knowledge.elements import get_element; assert get_element('H').symbol == 'H'"

      - name: Run test suite
        run: python -m pytest -q
